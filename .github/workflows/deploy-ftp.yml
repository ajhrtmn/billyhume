name: Deploy plugins to live FTP

# Fires only on pushes to the `stable` branch — the deliberate-release branch.
# `dev` and `master` never trigger this; a live site only updates when work
# is explicitly promoted to `stable`.
on:
  push:
    branches:
      - stable

# Only these are the ecosystem's own plugins. Everything else in
# wp-content/plugins (woocommerce, advanced-media-offloader, query-monitor,
# any other third-party plugin) is deliberately never touched by this
# workflow — Billy manages those himself via wp-admin/WordPress.org.
#
# Updated 2026-08-11 to match the actual current ecosystem — this list had
# drifted to only the original 7 plugins while bh-feedback, bh-live,
# bh-mailpoet, bh-social, bh-tickets, and bh-video shipped real, working
# code without ever being added here, so none of those six would have
# reached Billy's real site even after a `stable` promotion.
#
# Updated again 2026-08-25: self-hosted-self-admin-skin was the SAME class
# of gap, found by the drift check tools/check-plugin-whitelist.js now
# runs in CI specifically to catch this — tracked in git (.gitignore's own
# plugin allowlist), real shipped code, never in this list. 14 plugins now,
# kept in sync with that same .gitignore allowlist; the check below fails
# CI the next time the two lists disagree instead of silently drifting a
# third time.
env:
  PLUGIN_FOLDERS: >-
    the-self-hosted-self
    self-hosted-self-admin-skin
    bh-contest
    bh-courses
    bh-crm
    bh-feedback
    bh-live
    bh-mailpoet
    bh-monetization-woo
    bh-registry
    bh-social
    bh-streaming
    bh-tickets
    bh-video

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- build before deploy ----
      # The FTP sync ships plugin folders verbatim and the host runs nothing
      # but PHP + WordPress: no composer install, no npm, no autoloader
      # generation. So anything a plugin needs at runtime has to be BUILT
      # here and staged as part of the folder.
      #
      # Two artifacts are produced:
      #   1. assets/js/*.js from assets/ts/*.ts (tsc, no bundler)
      #   2. each plugin's own vendor/ dir, from its own composer.json if it
      #      has one (Timber/Twig live here)
      #
      # Both are committed today, so this is currently a VERIFICATION step —
      # it fails the deploy if the committed artifacts are stale rather than
      # silently shipping a mismatch. That property is worth keeping even
      # once the build is doing real work.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev tooling
        run: |
          npm ci
          composer install --no-interaction --prefer-dist

      - name: Build TypeScript
        run: npm run build:all

      - name: Install each plugin's runtime dependencies
        run: |
          set -euo pipefail
          for plugin in $PLUGIN_FOLDERS; do
            manifest="wp-content/plugins/$plugin/composer.json"
            if [ -f "$manifest" ]; then
              echo "::group::composer install (runtime) — $plugin"
              composer install                 --working-dir="wp-content/plugins/$plugin"                 --no-dev --optimize-autoloader --no-interaction --prefer-dist
              echo "::endgroup::"
            fi
          done

      # A stale committed artifact is a silent production bug: the site would
      # run yesterday's JS. Fail loudly instead.
      - name: Fail if built artifacts are stale
        run: |
          set -euo pipefail
          if ! git diff --quiet -- 'wp-content/plugins/*/assets/js/*.js'; then
            echo "::error::Committed .js is out of date with its .ts source. Run 'npm run build:all' and commit the result."
            git diff --stat -- 'wp-content/plugins/*/assets/js/*.js'
            exit 1
          fi
          echo "Built artifacts match their sources."

      # Stage only the ecosystem plugin folders above into a clean directory
      # so the FTP sync step below can never touch anything else, even if
      # PLUGIN_FOLDERS is edited incorrectly later.
      - name: Stage ecosystem plugins only
        run: |
          set -euo pipefail
          mkdir -p deploy_staging
          for plugin in $PLUGIN_FOLDERS; do
            src="wp-content/plugins/$plugin"
            if [ ! -d "$src" ]; then
              echo "::error::Expected plugin folder missing: $src"
              exit 1
            fi
            cp -r "$src" "deploy_staging/$plugin"
          done
          echo "Staged folders:"
          ls deploy_staging

      # PLACEHOLDERS — replace once real credentials exist for Billy's host.
      # Add these as GitHub Secrets (Settings > Secrets and variables >
      # Actions) before this workflow can actually deploy anything:
      #   FTP_SERVER    e.g. ftp.billyhumemusic.com
      #   FTP_USERNAME  the shared-hosting FTP account
      #   FTP_PASSWORD  the shared-hosting FTP password
      #   FTP_REMOTE_PLUGINS_PATH  e.g. /public_html/wp-content/plugins/
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_staging/
          server-dir: ${{ secrets.FTP_REMOTE_PLUGINS_PATH }}
          exclude: |
            **/.git*
            **/.git*/**

  # Generates "what actually shipped" from CHANGELOG.md entries rather than
  # asking anyone to hand-assemble it -- runs independently of the deploy
  # job above so a missing/placeholder FTP secret never blocks this from
  # producing notes. Reads whichever plugins' CHANGELOG.md changed between
  # the previous tip of `stable` and this push (github.event.before is
  # exactly that previous SHA) and writes a consolidated summary to the
  # run's own job summary -- always available, no extra API permissions
  # needed beyond the default GITHUB_TOKEN, no tag/Release management to
  # get wrong on a workflow that's never been exercised yet.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Summarize what changed in each plugin's CHANGELOG.md
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # A brand-new branch (before = all-zeros) has no prior commit to
          # diff against -- fall back to the first parent of this push.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=$(git rev-parse "$AFTER^" 2>/dev/null || echo "$AFTER")
          fi

          {
            echo "# Shipped to \`stable\` — $(date -u +%Y-%m-%d)"
            echo
            echo "Comparing \`${BEFORE:0:7}\`...\`${AFTER:0:7}\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          CHANGED_LOGS=$(git diff --name-only --diff-filter=ACMR "$BEFORE" "$AFTER" -- 'wp-content/plugins/*/CHANGELOG.md' || true)

          if [ -z "$CHANGED_LOGS" ]; then
            echo "_No plugin CHANGELOG.md changed in this promotion._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for log in $CHANGED_LOGS; do
            plugin=$(echo "$log" | sed -E 's#wp-content/plugins/([^/]+)/CHANGELOG.md#\1#')
            {
              echo "## $plugin"
              echo
              echo '```'
              # Only the ADDED lines (real new entries), stripped of the
              # diff +/- markers — a plugin's own CHANGELOG.md is newest-
              # first, so new entries are exactly the added lines at the
              # top of the diff.
              git diff "$BEFORE" "$AFTER" -- "$log" | grep -E '^\+[^+]' | sed 's/^\+//'
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
