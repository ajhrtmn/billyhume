name: Checks (PHPStan, PHPUnit, PHPCS, TypeScript, Stylelint, Vitest)

# Fires on every push/PR against dev and master — the two branches real
# work lands on. Deliberately NOT on `stable` (deploy-ftp.yml already
# owns that branch, and by the time something reaches `stable` it's
# already been checked here on dev/master first).
#
# Before this workflow existed, every check in this file (composer
# phpstan, composer test, tsc per plugin) only ever ran because a
# session happened to remember to run it by hand — a real gap between
# "we have the tooling" and "the tooling actually protects anything."
# This closes that gap: a failing PHPStan/PHPUnit/tsc run now fails the
# GitHub check on the PR/push itself, same as any other CI gate.
on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

jobs:
  phpstan-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan (all 12 plugins)
        run: composer phpstan

      - name: PHPUnit (pure-logic suites)
        run: composer test

      # Security sniffs (escaping / sanitization / nonce) on CHANGED files only.
      # Non-blocking for now: adopting WPCS on a mature 72k-line codebase
      # surfaces ~1,200 pre-existing low-severity findings, and a gate that
      # fails on day one is a gate that gets disabled. This surfaces findings
      # on the PR; flip continue-on-error off once the touched-file debt is
      # paid down. See wp-content/plugins/TOOLING-EVALUATION.md.
      - name: PHPCS security sniffs (changed files)
        continue-on-error: true
        run: bash tools/phpcs-changed.sh origin/${{ github.base_ref || 'master' }}

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm install
        run: npm ci

      # One tsc invocation per plugin that currently has a TypeScript
      # pilot (the-self-hosted-self/tsconfig.json etc.) — matches this repo's own
      # per-plugin build:<plugin>/watch:<plugin> npm scripts exactly, no
      # separate CI-only script to fall out of sync with package.json.
      - name: Build the-self-hosted-self
        run: npm run build:the-self-hosted-self
      - name: Build bh-contest
        run: npm run build:bh-contest
      - name: Build bh-crm
        run: npm run build:bh-crm
      - name: Build bh-streaming
        run: npm run build:bh-streaming
      - name: Build bh-courses
        run: npm run build:bh-courses

      # Fails the build on real CSS errors (malformed syntax, deprecated
      # values). Duplicate-selector findings are warnings, since this
      # codebase layers selectors deliberately.
      - name: Stylelint
        run: npm run lint:css

      - name: Unit tests (Vitest)
        run: npm run test:unit

  # Logged-out front-end UX audit — contrast, clipping, overflow, touch
  # targets across 6 widths. Needs no credentials, so it runs on every PR.
  # The authenticated admin audit (tests/ux/admin.spec.ts) is deliberately
  # NOT run here: it needs WP_ADMIN_USER/WP_ADMIN_PASS secrets and a
  # provisioned WordPress install, which this workflow doesn't stand up.
  ux-audit:
    runs-on: ubuntu-latest
    if: false   # enable once CI provisions a WordPress instance to audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm ci
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: UX audit (logged-out)
        run: npx playwright test --project=public
