name: Checks (PHPStan, PHPUnit, PHPCS, TypeScript, Stylelint, Vitest)

# Fires on every push/PR against dev and master — the two branches real
# work lands on. Deliberately NOT on `stable` (deploy-ftp.yml already
# owns that branch, and by the time something reaches `stable` it's
# already been checked here on dev/master first).
#
# Before this workflow existed, every check in this file (composer
# phpstan, composer test, tsc per plugin) only ever ran because a
# session happened to remember to run it by hand — a real gap between
# "we have the tooling" and "the tooling actually protects anything."
# This closes that gap: a failing PHPStan/PHPUnit/tsc run now fails the
# GitHub check on the PR/push itself, same as any other CI gate.
on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

jobs:
  phpstan-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan (all 12 plugins)
        run: composer phpstan

      # Non-blocking signal, not a gate -- OPEN.md already names why:
      # level 6 is clean, level 7 currently sits around 486 findings
      # (mostly |false/|WP_Error unions), real debt nobody's committed to
      # paying down yet. Same "a gate that fails on day one gets
      # disabled" reasoning as the PHPCS step below. This just makes the
      # count visible on every run instead of only when someone happens
      # to run it by hand.
      - name: PHPStan level 7 (tracked, non-blocking)
        continue-on-error: true
        run: ./vendor/bin/phpstan analyse -c phpstan-level7.neon --memory-limit=2G

      - name: PHPUnit (pure-logic suites)
        run: composer test

      # Security sniffs (escaping / sanitization / nonce) on CHANGED files only.
      # Non-blocking for now: adopting WPCS on a mature 72k-line codebase
      # surfaces ~1,200 pre-existing low-severity findings, and a gate that
      # fails on day one is a gate that gets disabled. This surfaces findings
      # on the PR; flip continue-on-error off once the touched-file debt is
      # paid down. See wp-content/plugins/TOOLING-EVALUATION.md.
      - name: PHPCS security sniffs (changed files)
        continue-on-error: true
        run: bash tools/phpcs-changed.sh origin/${{ github.base_ref || 'master' }}

  # Cheap, fast, no PHP/Node setup needed — catches the class of drift
  # this repo has hit at least twice: deploy-ftp.yml's PLUGIN_FOLDERS
  # silently falling out of step with tools/ecosystem-plugins.txt (most
  # recently self-hosted-self-admin-skin, shipped for a full session
  # while absent from the deploy list, found only by reading both files
  # side by side).
  repo-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plugin whitelist matches deploy-ftp.yml
        run: bash tools/check-plugin-whitelist.sh
      # Advisory, not blocking -- see tools/check-version-bump.sh's own
      # header for why. Surfaces CLAUDE.md's "version + CHANGELOG.md move
      # together" convention on the PR itself instead of only being
      # caught if a reviewer happens to remember to check for it.
      - name: Version-bump convention (changed plugins touch their own CHANGELOG.md)
        run: bash tools/check-version-bump.sh origin/${{ github.base_ref || 'master' }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Advisory, not blocking -- see the script's own docblock. Surfaces
      # CLAUDE.md's most-repeated hard rule (class_exists() at hook-call
      # time, never file-parse time) as something reviewed on every push
      # instead of only when a person remembers to grep for it by hand.
      - name: class_exists() timing (advisory)
        run: node tools/check-class-exists-timing.js
      # Advisory, not blocking -- see the script's own header for why
      # (real pre-existing drift on 4 of 14 plugins as of the commit that
      # added this). Narrower than "docs drift" sounds: only checks that
      # each plugin's Version: header agrees with its own CHANGELOG.md's
      # newest entry, not whether any doc's prose still matches reality.
      - name: "CHANGELOG.md matches plugin Version: header (advisory)"
        run: bash tools/check-changelog-drift.sh

  # The single highest-value gap named by this ecosystem's own docs
  # (TOOLING-EVALUATION.md, OPEN.md): the money paths (BHM_Wallet's
  # atomic debit here first, more to follow) were deliberately untested
  # because a hand-stubbed $wpdb can only confirm a query STRING looks
  # right, never that a real database actually enforces it. Real
  # WordPress + real MySQL via @wordpress/env, which ubuntu-latest's
  # bundled Docker runs natively -- no new runtime dependency, dev/CI
  # only, same posture as every other tool in this file.
  #
  # continue-on-error while this graduates: built and verified locally
  # this same session (including deliberately breaking the atomic guard
  # this suite exists to catch, and confirming it fails), but this is
  # its first run in GitHub's own runner environment specifically, which
  # is a real, if small, unknown until proven here at least once.
  db-integration-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install tests-integration's own composer dependencies
        working-directory: wp-content/plugins/bh-monetization-woo/tests-integration
        run: composer install --no-interaction --prefer-dist
      - name: Start @wordpress/env
        run: npx @wordpress/env start
      - name: Run bh-monetization-woo's real-database suite
        run: |
          npx @wordpress/env run tests-cli bash -c \
            "cd /var/www/html/wp-content/plugins/bh-monetization-woo/tests-integration && WP_TESTS_DIR=/wordpress-phpunit vendor/bin/phpunit -c phpunit.xml"

  # Screenshot-diffs the real Storybook build against committed Linux
  # baselines -- see tests/ux/storybook-visual.spec.ts's own docblock.
  # continue-on-error while this graduates, same posture and same reason
  # as db-integration-tests above: built and verified this same session
  # (including deliberately regressing a fixture and confirming it fails,
  # then reverting and confirming a clean pass), but this is its first
  # run in GitHub's own runner environment specifically. Runs on
  # ubuntu-latest deliberately -- the baselines are named *-linux.png and
  # will not match any other platform's font rendering.
  storybook-visual:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: npm install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Storybook visual regression
        # PW_STORYBOOK gates playwright.config.ts's webServer block -- see
        # that file's own comment for why it can't be unconditional.
        env:
          PW_STORYBOOK: '1'
        run: npx playwright test --project=storybook

  # Post-deploy smoke canary — the single highest-value CI gap named by
  # the 2026-08-30 tech-debt audit. `master` auto-deploys to live via
  # deploy-ftp.yml, and this session every regression that reached a
  # human (a PHP fatal from an unescaped quote in a CSS-in-PHP string, a
  # white-screen step container, a bundle frozen at an old version by a
  # host page-cache) would have been caught here first.
  #
  # It points at the REAL LIVE SITE rather than provisioning a parallel
  # WordPress instance — same call, and same read-only-by-construction
  # safety (page.goto + text assertions only, no login, no form submit),
  # as the ux-audit job in storybook-audit.yml. Default target is the
  # Bluehost production site; override with the SMOKE_BASE_URL repo
  # variable, or SMOKE_EXTRA_PATHS for extra URLs on a given run.
  #
  # This is a CANARY, not a pre-deploy GATE: on a `master` push the FTP
  # sync has usually already run by the time this fires, so it tells you
  # prod broke rather than stopping the break. A true gate needs
  # @wordpress/env with the plugins activated and pages seeded — the
  # db-integration-tests level of effort, tracked as the follow-up.
  #
  # continue-on-error while it graduates, same posture as
  # db-integration-tests / storybook-visual above: the spec was written
  # and run locally against the live site the same session it was added,
  # but this is its first run from GitHub's own runners.
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm ci
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke the live site
        env:
          WP_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://billyhume.net' }}
          SMOKE_EXTRA_PATHS: ${{ vars.SMOKE_EXTRA_PATHS }}
        run: npx playwright test --project=smoke
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: tests/ux/report
          retention-days: 14

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm install
        run: npm ci

      # One tsc invocation per plugin that currently has a TypeScript
      # pilot (the-self-hosted-self/tsconfig.json etc.) — matches this repo's own
      # per-plugin build:<plugin>/watch:<plugin> npm scripts exactly, no
      # separate CI-only script to fall out of sync with package.json.
      - name: Build the-self-hosted-self
        run: npm run build:the-self-hosted-self
      - name: Build bh-contest
        run: npm run build:bh-contest
      - name: Build bh-crm
        run: npm run build:bh-crm
      - name: Build bh-streaming
        run: npm run build:bh-streaming
      - name: Build bh-courses
        run: npm run build:bh-courses

      # Fails the build on real CSS errors (malformed syntax, deprecated
      # values). Duplicate-selector findings are warnings, since this
      # codebase layers selectors deliberately.
      - name: Stylelint
        run: npm run lint:css

      - name: Unit tests (Vitest)
        run: npm run test:unit

  # The logged-out UX audit used to sit here, disabled ("enable once CI
  # provisions a WordPress instance to audit"). It never needed a
  # provisioned instance -- one already exists in production, and
  # tests/ux/public.spec.ts is read-only by construction (page.goto +
  # measurement, never a form submit). Moved to its own workflow,
  # storybook-audit.yml, which points it at the real live site instead of
  # standing up a parallel install, and pairs it with the Storybook build
  # job -- both are heavier/more occasional than this file's always-run
  # gates, and both are also runnable on demand (workflow_dispatch, or
  # the "Trigger via GitHub Actions" button in Design Suite).
