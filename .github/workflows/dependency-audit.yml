name: Scheduled Dependency Audit

# Dependabot (dependabot.yml) catches known-vulnerable versions at the
# moment it opens a PR for something else. It does NOT re-check already-
# committed, already-up-to-date dependencies when a NEW CVE is disclosed
# against a version already sitting in the lockfile untouched -- nothing
# else in this repo re-checks that gap between pushes. This does, on a
# schedule, independent of whether anything else changed.
#
# Read-only: `composer audit` / `npm audit` inspect the committed root
# lockfiles against public advisory databases; no code runs. There are no
# Composer runtime dependencies (FPDF is vendored by hand), so only the
# dev-tooling lockfiles are audited.

on:
  schedule:
    # 06:00 UTC every Monday -- same day dependabot.yml's own weekly
    # schedule opens PRs, so a human sees both in one sitting.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Composer install (dev tooling)
        run: composer install --no-interaction --prefer-dist

      - name: composer audit (dev tooling)
        id: composer_audit
        continue-on-error: true
        run: composer audit

      - name: npm ci
        run: npm ci

      - name: npm audit
        id: npm_audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Open an issue on any hit
        if: steps.composer_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Dependency audit found something — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              'One or more scheduled dependency audits failed this run.',
              '',
              `- composer audit (dev tooling): ${{ steps.composer_audit.outcome }}`,
              `- npm audit (--audit-level=high): ${{ steps.npm_audit.outcome }}`,
              '',
              `See the full run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'dependencies'],
            });

      - name: Fail the run so it's visible in the Actions tab
        if: steps.composer_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        run: exit 1
